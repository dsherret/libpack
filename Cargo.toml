[package]
name = "deno_bundle_proto"
version = "0.1.0"
edition = "2024"

[dependencies]
deno_cache_dir        = { version = "0.22.1", features = ["sync"] }
deno_config           = { version = "0.54.2", features = ["workspace", "sync"] }
deno_error            = "0.6.0"
deno_graph            = "0.94.2"
deno_npm_cache        = { path = "../deno/resolvers/npm_cache" }
deno_npm_installer    = { path = "../deno/resolvers/npm_installer" }
deno_path_util        = "0.3.3"
deno_resolver         = { path = "../deno/resolvers/deno", features = ["graph", "sync"] }
node_resolver         = { path = "../deno/resolvers/node", features = ["sync"] }
reqwest               = "0.12.9"
tokio = { version = "1.45.1", features = ["full"] }
url = "2.5.4"
sys_traits            = { version = "0.1.12", features = ["real", "libc", "winapi", "getrandom"] }
async-trait = "0.1.88"
deno_ast = { version = "0.48.0", features = ["transpiling", "swc_visit"] }
anyhow = "1.0.98"
indexmap = "2.9.0"
